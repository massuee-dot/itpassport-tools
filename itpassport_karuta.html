<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート用語カルタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --ink: #171C26;
    --ink-soft: #5A6270;
    --line: #E2E5EA;
    --primary: #21409A;
    --primary-deep: #152A6B;
    --primary-tint: #EAEEFB;
    --amber: #E8A33D;
    --amber-deep: #C97A15;
    --amber-tint: #FDF1DE;
    --good: #1F8A5F;
    --good-tint: #E5F5EE;
    --bad: #C6394B;
    --bad-tint: #FBEAEC;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 96px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 0 16px; }

  header{
    background: var(--primary-deep);
    color: #fff;
    padding: 20px 0 16px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 14px rgba(21,42,107,0.18);
  }
  .brand{
    font-weight: 900;
    font-size: 1.12rem;
    letter-spacing: 0.02em;
  }
  .brand small{
    display:block;
    font-family: "Space Mono", monospace;
    font-weight: 400;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: #C9D2F2;
    margin-top: 2px;
  }
  .stat-row{
    display:flex;
    gap: 8px;
    margin-top: 14px;
  }
  .stat{
    flex:1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    padding: 8px 6px;
    text-align:center;
  }
  .stat-value{
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 1.15rem;
    line-height: 1.1;
  }
  .stat-value.combo{ color: var(--amber); }
  .stat-label{
    font-size: 0.62rem;
    color: #B9C3EC;
    margin-top: 3px;
  }

  .chips-row{
    margin-top: 14px;
    padding-bottom: 2px;
    display:flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 0.74rem;
    border: 1px solid rgba(255,255,255,0.28);
    color: #D7DEF6;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active{
    background: #fff;
    color: var(--primary-deep);
    border-color: #fff;
    font-weight: 700;
  }

  main{ padding-top: 18px; }

  .instructions{
    font-size: 0.82rem;
    color: var(--ink-soft);
    text-align:center;
    margin-bottom: 14px;
    line-height: 1.6;
  }

  .board{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .card{
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    min-height: 84px;
    padding: 10px 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: transform .1s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .card.term{ font-weight: 700; }
  .card:active{ transform: scale(0.96); }
  .card.selected{
    border-color: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-tint);
    background: var(--amber-tint);
  }
  .card.correct{
    animation: cardClear .38s ease forwards;
    border-color: var(--good);
    background: var(--good-tint);
  }
  .card.wrong{
    animation: cardShake .32s ease;
    border-color: var(--bad);
    background: var(--bad-tint);
  }
  .card.empty{
    visibility: hidden;
    pointer-events: none;
  }
  .card.fresh{
    animation: cardIn .3s ease;
  }
  @keyframes cardClear{
    0%{ opacity:1; transform: scale(1); }
    100%{ opacity:0; transform: scale(0.7); }
  }
  @keyframes cardShake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-5px); }
    75%{ transform: translateX(5px); }
  }
  @keyframes cardIn{
    0%{ opacity:0; transform: scale(0.75); }
    100%{ opacity:1; transform: scale(1); }
  }

  .levelup-toast{
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--amber);
    color: #3A2400;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    z-index: 50;
    opacity: 0;
    transition: transform .3s cubic-bezier(.2,1.4,.4,1), opacity .3s ease;
    pointer-events: none;
  }
  .levelup-toast.show{
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .footer-row{
    display:flex;
    justify-content: center;
    margin-top: 20px;
  }
  .reset-btn{
    background: #fff;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 9px 20px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .reset-btn:hover{ border-color: var(--ink-soft); color: var(--ink); }

  .empty-state{
    text-align:center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  /* 間違えた単語パネル */
  .missed-panel{
    position: fixed;
    left:0; right:0; bottom:0;
    background: #fff;
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(23,28,38,0.08);
    z-index: 30;
    max-height: 44vh;
    display:flex;
    flex-direction: column;
  }
  .missed-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 11px 18px;
    cursor: pointer;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .missed-head-left{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .missed-count{
    font-family:"Space Mono", monospace;
    background: var(--bad-tint);
    color: var(--bad);
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 0.75rem;
  }
  .missed-count.zero{ background: var(--good-tint); color: var(--good); }
  .missed-toggle{ color: var(--ink-soft); font-size: 0.75rem; }
  .missed-body{
    display:none;
    overflow-y:auto;
    padding: 0 18px 16px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .missed-body.open{ display:block; }
  .missed-list{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .missed-chip{
    font-size: 0.78rem;
    background: var(--bad-tint);
    color: var(--bad);
    border: 1px solid #F0C4CA;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    max-width: 100%;
  }
  .missed-chip .cnt{
    font-family:"Space Mono", monospace;
    opacity: 0.75;
    margin-left: 4px;
  }
  .missed-chip .def{
    display:none;
    margin-top: 4px;
    color: var(--ink-soft);
    font-size: 0.74rem;
    line-height: 1.5;
  }
  .missed-chip.expanded .def{ display:block; }
  .missed-empty{ color: var(--ink-soft); font-size: 0.85rem; padding: 4px 0 8px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">ITパスポート用語カルタ<small>意味のペアをタップして揃えよう &middot; 全390語</small></div>
    <div class="stat-row">
      <div class="stat"><div class="stat-value" id="levelValue">Lv.1</div><div class="stat-label">レベル</div></div>
      <div class="stat"><div class="stat-value combo" id="comboValue">0</div><div class="stat-label">コンボ</div></div>
      <div class="stat"><div class="stat-value" id="bestValue">0</div><div class="stat-label">自己ベスト</div></div>
      <div class="stat"><div class="stat-value" id="totalValue">0</div><div class="stat-label">正解ペア数</div></div>
    </div>
    <div class="chips-row" id="chipsRow"></div>
  </div>
</header>

<main class="wrap">
  <div class="instructions">用語のカードと、その意味のカードをタップして正しいペアを揃えてくださいませ。揃えるほど盤面が広がっていきますわ。よく間違える用語は、より高い頻度で出てくるようになりますの。</div>
  <div class="board" id="board"></div>
  <div class="footer-row">
    <button class="reset-btn" id="resetBtn">🔄 やり直す</button>
  </div>
</main>

<div class="missed-panel">
  <div class="missed-head" id="missedHead">
    <div class="missed-head-left">
      間違えた単語
      <span class="missed-count zero" id="missedCount">0語</span>
    </div>
    <span class="missed-toggle" id="missedToggleLabel">開く ▲</span>
  </div>
  <div class="missed-body" id="missedBody">
    <div class="missed-empty" id="missedEmpty">間違えた用語がここに溜まっていきますわ。タップすると意味が確認できますの。</div>
    <div class="missed-list" id="missedList"></div>
  </div>
</div>

<div class="levelup-toast" id="levelupToast">🎉 レベルアップ！</div>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const ALPHA_CATEGORY = "英字略語のみ";
const ALPHA_ONLY_REGEX = /^[A-Za-z]+$/;

function pool(){
  if(activeCategory === "すべて") return ALL_TERMS;
  if(activeCategory === ALPHA_CATEGORY) return ALL_TERMS.filter(t => ALPHA_ONLY_REGEX.test(t.term));
  return ALL_TERMS.filter(t => t.cat === activeCategory);
}

function ensureStats(id){
  if(!termStats[id]) termStats[id] = {weight: 5, wrongCount: 0, correctStreak: 0};
  return termStats[id];
}

function weightedPick(candidates){
  if(candidates.length === 0) return null;
  let total = 0;
  const weights = candidates.map(t => {
    const w = ensureStats(t.id).weight;
    total += w;
    return w;
  });
  let r = Math.random() * total;
  for(let i=0;i<candidates.length;i++){
    r -= weights[i];
    if(r <= 0) return candidates[i];
  }
  return candidates[candidates.length-1];
}

function drawOne(){
  const onBoardIds = board.filter(s => s && s.state !== 'empty').map(s => s.pairId);
  let candidates = pool().filter(t => !onBoardIds.includes(t.id));
  if(candidates.length === 0) candidates = pool();
  return weightedPick(candidates);
}

  let lvl = 1;
  for(let i=1;i<LEVEL_THRESHOLDS.length;i++){
    if(total >= LEVEL_THRESHOLDS[i]) lvl = i+1;
  }
  return Math.min(lvl, LEVEL_PAIRS.length);
}

function initGame(){
  combo = 0;
  totalMatched = 0;
  currentLevel = 1;
  selectedIndex = null;
  busy = false;
  termStats = {};
  missedTerms = {};
  renderMissedPanel();
  const pairs = pairsForLevel(currentLevel);
  buildBoardWithPairs(pairs);
  updateStats();
}

function buildBoardWithPairs(pairCount){
  const slots = [];
  for(let i=0;i<pairCount;i++){
    const t = drawOne();
    if(!t) continue;
    slots.push({pairId:t.id, type:'term', text:t.term, state:'filled'});
    slots.push({pairId:t.id, type:'def', text:t.def, state:'filled'});
  }
  board = shuffle(slots);
  renderBoard(true);
}

function renderBoard(fresh){
  const el = document.getElementById('board');
  if(board.length === 0){
    el.innerHTML = '<div class="empty-state">この分野の用語が足りませんわ。別のタグをお試しくださいませ。</div>';
    return;
  }
  el.innerHTML = '';
  board.forEach((slot, i) => {
    const div = document.createElement('div');
    let cls = 'card';
    if(slot.state === 'empty'){
      cls += ' empty';
    } else {
      if(slot.type === 'term') cls += ' term';
      if(i === selectedIndex) cls += ' selected';
      if(fresh) cls += ' fresh';
    }
    div.className = cls;
    div.textContent = slot.state === 'empty' ? '' : slot.text;
    div.dataset.idx = i;
    if(slot.state !== 'empty'){
      div.addEventListener('click', () => onTapCard(i));
    }
    el.appendChild(div);
  });
}

function updateStats(){
  document.getElementById('levelValue').textContent = 'Lv.' + currentLevel;
  document.getElementById('comboValue').textContent = combo;
  document.getElementById('bestValue').textContent = bestCombo;
  document.getElementById('totalValue').textContent = totalMatched;
}

function flashLevelUp(){
  const toast = document.getElementById('levelupToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1400);
}

function growBoardIfNeeded(){
  const desiredPairs = pairsForLevel(levelForTotal(totalMatched));
  if(desiredPairs > currentLevelPairsCount()){
    currentLevel = levelForTotal(totalMatched);
    const t = drawOne();
    if(t){
      board.push({pairId:t.id, type:'term', text:t.term, state:'filled'});
      board.push({pairId:t.id, type:'def', text:t.def, state:'filled'});
      board = shuffle(board);
    }
    flashLevelUp();
  }
}

function currentLevelPairsCount(){
  return Math.floor(board.length / 2);
}

function renderMissedPanel(){
  const countEl = document.getElementById('missedCount');
  const listEl = document.getElementById('missedList');
  const emptyEl = document.getElementById('missedEmpty');
  const ids = Object.keys(missedTerms).map(Number).sort((a,b) => missedTerms[b]-missedTerms[a]);
  countEl.textContent = ids.length + '語';
  countEl.className = 'missed-count' + (ids.length === 0 ? ' zero' : '');
  listEl.innerHTML = '';
  if(ids.length === 0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    ids.forEach(id => {
      const t = TERMS_BY_ID[id];
      if(!t) return;
      const chip = document.createElement('div');
      chip.className = 'missed-chip';
      chip.innerHTML = t.term + '<span class="cnt">×' + missedTerms[id] + '</span>' +
                        '<div class="def">' + t.def + '</div>';
      chip.onclick = () => {
        chip.classList.toggle('expanded');
      };
      listEl.appendChild(chip);
    });
  }
}

let missedOpen = false;
document.getElementById('missedHead').addEventListener('click', () => {
  missedOpen = !missedOpen;
  document.getElementById('missedBody').className = 'missed-body' + (missedOpen ? ' open' : '');
  document.getElementById('missedToggleLabel').textContent = missedOpen ? '閉じる ▼' : '開く ▲';
});

function registerCorrect(id){
  const s = ensureStats(id);
  s.correctStreak += 1;
  s.weight = Math.max(1, s.weight * 0.55);
}

function registerWrong(id){
  const s = ensureStats(id);
  s.correctStreak = 0;
  s.wrongCount += 1;
  s.weight = s.weight + 12;
  missedTerms[id] = (missedTerms[id] || 0) + 1;
  renderMissedPanel();
}

function onTapCard(i){
  if(busy) return;
  const slot = board[i];
  if(!slot || slot.state !== 'filled') return;

  if(selectedIndex === null){
    selectedIndex = i;
    renderBoard(false);
    return;
  }
  if(selectedIndex === i){
    selectedIndex = null;
    renderBoard(false);
    return;
  }

  const a = board[selectedIndex];
  const b = board[i];
  const first = selectedIndex;
  const second = i;

  if(a.pairId === b.pairId && a.type !== b.type){
    // 正解
    busy = true;
    board[first].state = 'clearing';
    board[second].state = 'clearing';
    renderMatchAnimation(first, second, true);
    combo += 1;
    totalMatched += 1;
    registerCorrect(a.pairId);
    if(combo > bestCombo){ bestCombo = combo; saveBest(); }
    selectedIndex = null;
    setTimeout(() => {
      board[first].state = 'empty';
      board[second].state = 'empty';
      growBoardIfNeeded();
      updateStats();
      renderBoard(false);
      setTimeout(() => {
        const t = drawOne();
        if(t){
          const emptySlots = board.map((s,idx)=>s.state==='empty'?idx:null).filter(v=>v!==null);
          const shuffledEmpty = shuffle(emptySlots).slice(0,2);
          if(shuffledEmpty.length === 2){
            board[shuffledEmpty[0]] = {pairId:t.id, type:'term', text:t.term, state:'filled'};
            board[shuffledEmpty[1]] = {pairId:t.id, type:'def', text:t.def, state:'filled'};
          }
        }
        busy = false;
        renderBoard(false);
      }, 550);
    }, 380);
  } else {
    // 不正解
    busy = true;
    renderMatchAnimation(first, second, false);
    registerWrong(a.pairId);
    if(b.pairId !== a.pairId) registerWrong(b.pairId);
    combo = 0;
    selectedIndex = null;
    updateStats();
    setTimeout(() => {
      busy = false;
      renderBoard(false);
    }, 340);
  }
}

function renderMatchAnimation(i1, i2, isCorrect){
  const el = document.getElementById('board');
  [i1,i2].forEach(idx => {
    const cardEl = el.querySelector('[data-idx="'+idx+'"]');
    if(cardEl){
      cardEl.classList.remove('selected');
      cardEl.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });
}

function renderChips(){
  const row = document.getElementById('chipsRow');
  row.innerHTML = '';
  const cats = ["すべて", ...CATEGORIES, ALPHA_CATEGORY];
  cats.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat === activeCategory ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => {
      if(activeCategory === cat) return;
      activeCategory = cat;
      renderChips();
      initGame();
    };
    row.appendChild(chip);
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  initGame();
});

(async function start(){
  await loadBest();
  renderChips();
  initGame();
})();
</script>
