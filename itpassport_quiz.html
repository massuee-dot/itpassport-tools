<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート 練習問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --ink: #171C26;
    --ink-soft: #5A6270;
    --line: #E2E5EA;
    --primary: #21409A;
    --primary-deep: #152A6B;
    --primary-tint: #EAEEFB;
    --good: #1F8A5F;
    --good-tint: #E5F5EE;
    --bad: #C6394B;
    --bad-tint: #FBEAEC;
    --amber: #C97A2B;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 88px;
  }
  .wrap{ max-width: 720px; margin: 0 auto; padding: 0 18px; }

  /* Header */
  header{
    background: var(--primary-deep);
    color: #fff;
    padding: 22px 0 0 0;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 14px rgba(21,42,107,0.18);
  }
  .header-top{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand{
    font-weight: 900;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .brand small{
    display:block;
    font-family: "Space Mono", monospace;
    font-weight: 400;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    color: #AEB9E6;
    margin-top: 2px;
  }
  .jump-form{
    display:flex;
    align-items:center;
    gap:6px;
    font-family: "Space Mono", monospace;
    font-size: 0.78rem;
    color: #C9D2F2;
  }
  .jump-form input{
    width: 44px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 6px;
    color: #fff;
    padding: 5px 6px;
    font-family: inherit;
    font-size: inherit;
    text-align:center;
  }
  .jump-form button{
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 0.72rem;
    cursor: pointer;
    font-family: inherit;
  }
  .jump-form button:hover{ background: rgba(255,255,255,0.24); }

  .progress-row{
    margin-top: 14px;
    display:flex;
    align-items:center;
    gap: 10px;
    font-family: "Space Mono", monospace;
    font-size: 0.72rem;
    color: #C9D2F2;
  }
  .progress-track{
    flex:1;
    height: 5px;
    background: rgba(255,255,255,0.16);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, #6C8CEE, #A6D1FF);
    width:0%;
    transition: width .25s ease;
  }

  .chips-row{
    margin-top: 16px;
    padding-bottom: 14px;
    display:flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 0.75rem;
    border: 1px solid rgba(255,255,255,0.28);
    color: #D7DEF6;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s ease;
  }
  .chip.active{
    background: #fff;
    color: var(--primary-deep);
    border-color: #fff;
    font-weight: 700;
  }
  .chip.shuffle{
    margin-left: auto;
    display:flex;
    align-items:center;
    gap: 5px;
  }
  .chip.shuffle.on{
    background: var(--amber);
    border-color: var(--amber);
    color: #fff;
  }

  /* Card */
  main{ padding-top: 20px; }
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px 20px;
    position: relative;
    overflow: hidden;
  }
  .cat-tag{
    display:inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-tint);
    padding: 3px 10px;
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .q-number{
    font-family: "Space Mono", monospace;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-left: 8px;
  }
  .q-text{
    font-size: 1.04rem;
    line-height: 1.75;
    font-weight: 500;
    margin: 4px 0 20px;
  }

  .choice{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: #FCFCFD;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--ink);
    transition: border-color .12s ease, background .12s ease;
  }
  .choice:hover:not(.locked){ border-color: var(--primary); background: var(--primary-tint); }
  .choice .badge{
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family: "Space Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .choice.correct{ border-color: var(--good); background: var(--good-tint); }
  .choice.correct .badge{ border-color: var(--good); color: var(--good); background:#fff; }
  .choice.wrong{ border-color: var(--bad); background: var(--bad-tint); }
  .choice.wrong .badge{ border-color: var(--bad); color: var(--bad); background:#fff; }
  .choice.locked{ cursor: default; }
  .choice-body{ flex: 1; }
  .choice-note{
    display:none;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-top: 6px;
    line-height: 1.55;
  }
  .choice-note.show{ display:block; }

  .stamp{
    position:absolute;
    top: 16px; right: 18px;
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 6px 14px;
    border-radius: 8px;
    opacity:0;
    transform: scale(0.6) rotate(-8deg);
    pointer-events:none;
  }
  .stamp.show{
    animation: stampIn .32s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{ opacity:0; transform: scale(0.5) rotate(-10deg); }
    70%{ opacity:1; transform: scale(1.12) rotate(-6deg); }
    100%{ opacity:1; transform: scale(1) rotate(-6deg); }
  }
  .stamp.correct{ background: var(--good-tint); color: var(--good); border: 2px solid var(--good); }
  .stamp.wrong{ background: var(--bad-tint); color: var(--bad); border: 2px solid var(--bad); }

  .explain-box{
    display:none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
  }
  .explain-box.show{ display:block; }
  .explain-label{
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--primary);
    margin-bottom: 6px;
  }

  .nav-row{
    display:flex;
    gap: 10px;
    margin-top: 18px;
  }
  .nav-btn{
    flex:1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
  }
  .nav-btn.prev{ background: #fff; border: 1.5px solid var(--line); color: var(--ink); }
  .nav-btn.prev:hover{ border-color: var(--ink-soft); }
  .nav-btn.next{ background: var(--primary); color: #fff; }
  .nav-btn.next:hover{ background: var(--primary-deep); }
  .nav-btn:disabled{ opacity: 0.4; cursor: default; }

  .empty-state{
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
  }

  /* Bottom review panel */
  .review-panel{
    position: fixed;
    left:0; right:0; bottom:0;
    background: #fff;
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(23,28,38,0.08);
    z-index: 30;
    max-height: 42vh;
    display:flex;
    flex-direction: column;
  }
  .review-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 11px 18px;
    cursor: pointer;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .review-head-left{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 700;
  }
  .review-count{
    font-family:"Space Mono", monospace;
    background: var(--bad-tint);
    color: var(--bad);
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 0.75rem;
  }
  .review-count.zero{ background: var(--good-tint); color: var(--good); }
  .review-toggle{ color: var(--ink-soft); font-size: 0.75rem; }
  .review-body{
    display:none;
    overflow-y:auto;
    padding: 0 18px 16px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .review-body.open{ display:block; }
  .review-list{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .review-chip{
    font-family: "Space Mono", monospace;
    font-size: 0.78rem;
    background: var(--bad-tint);
    color: var(--bad);
    border: 1px solid #F0C4CA;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .review-chip:hover{ background: #F6D3D8; }
  .review-empty{ color: var(--ink-soft); font-size: 0.85rem; padding: 4px 0 8px; }

  @media (max-width: 480px){
    .brand{ font-size: 1.02rem; }
    .q-text{ font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-top">
      <div class="brand">ITパスポート 練習問題<small>SYLLABUS Ver.6.5 準拠 &middot; 全95問</small></div>
      <form class="jump-form" id="jumpForm">
        <span>No.</span>
        <input type="number" id="jumpInput" min="1" max="95">
        <button type="submit">移動</button>
      </form>
    </div>
    <div class="progress-row">
      <span id="progressLabel">1 / 63</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="scoreLabel">正解 0</span>
    </div>
    <div class="chips-row" id="chipsRow"></div>
  </div>
</header>

<main class="wrap">
  <div class="card" id="card"></div>
</main>

<div class="review-panel">
  <div class="review-head" id="reviewHead">
    <div class="review-head-left">
      復習リスト
      <span class="review-count zero" id="reviewCount">0問</span>
    </div>
    <span class="review-toggle" id="reviewToggleLabel">開く ▲</span>
  </div>
  <div class="review-body" id="reviewBody">
    <div class="review-empty" id="reviewEmpty">間違えた問題がここに表示されますわ。まずは1問ずつ進めてみてくださいませ。</div>
    <div class="review-list" id="reviewList"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"cat": "企業と法務", "q": "経営資源として伝統的に「ヒト・モノ・カネ」とともに数えられるものはどれか。", "choices": ["情報", "知的財産権の存続期間", "市場シェア", "仕入先との協力関係"], "ans": 0, "notes": ["正解。IT化が進んだ現代では「情報」も重要な経営資源の一つとされる。", "知的財産権の存続期間は法的な保護期間を示す概念であり、経営資源そのものではない。", "市場シェアは経営活動の結果を示す指標であり、経営資源そのものではない。", "仕入先との協力関係は外部との関係性であり、経営資源の伝統的な定義には含まれない。"], "id": 1}, {"cat": "企業と法務", "q": "PDCAサイクルにおいて、実施した施策の結果を確認する工程はどれか。", "choices": ["Plan", "Do", "Check", "Act"], "ans": 2, "notes": ["Planは計画を立てる工程。", "Doは計画を実行する工程。", "正解。Checkは実行結果を評価・確認する工程。", "Actは評価結果をもとに改善する工程。"], "id": 2}, {"cat": "企業と法務", "q": "損益分岐点の説明として最も適切なものはどれか。", "choices": ["売上高と総費用が一致し、利益がゼロになる売上高", "固定費と変動費の合計が最大になる点", "企業が黒字倒産する売上高", "限界利益率が最も低くなる売上高"], "ans": 0, "notes": ["正解。損益分岐点はこれ以上売れば利益が出る境目の売上高を指す。", "「合計が最大になる点」という考え方自体が損益分岐点の定義ではない。", "黒字倒産は資金繰りの問題であり、損益分岐点とは別の概念。", "限界利益率の高低と損益分岐点の定義そのものは直接関係しない。"], "id": 3}, {"cat": "企業と法務", "q": "貸借対照表に記載される項目として適切なものはどれか。", "choices": ["資産・負債・純資産", "収益と費用", "キャッシュフロー", "販売費及び一般管理費の内訳"], "ans": 0, "notes": ["正解。貸借対照表はある時点の資産・負債・純資産の状態を示す財務諸表。", "収益と費用は損益計算書に記載される項目。", "資金の流れはキャッシュフロー計算書に記載される。", "販売費及び一般管理費の内訳も損益計算書側の情報である。"], "id": 4}, {"cat": "企業と法務", "q": "著作権法における違法行為として最も適切なものはどれか。", "choices": ["私的使用目的で音楽CDを個人のために複製すること", "違法にアップロードされたと知りながら著作物をダウンロードすること", "図書館で本を借りて読むこと", "自分で購入したソフトウェアを1台のPCにインストールすること"], "ans": 1, "notes": ["私的使用の範囲内の複製は原則として認められている。", "正解。違法アップロードと知りながらのダウンロードは著作権法違反となる。", "図書館での貸出・閲覧は通常の利用であり違法ではない。", "ライセンスの範囲内での1台へのインストールは問題ない。"], "id": 5}, {"cat": "企業と法務", "q": "特許権や商標権などを保護する法律の総称として適切なものはどれか。", "choices": ["著作権法", "産業財産権関連法規", "不正競争防止法", "個人情報保護法"], "ans": 1, "notes": ["著作権法は音楽・プログラムなどの著作物を保護する法律。", "正解。特許法・実用新案法・意匠法・商標法などをまとめて産業財産権関連法規と呼ぶ。", "不正競争防止法は営業秘密などを保護する法律。", "個人情報保護法は個人情報の取扱いを規律する法律。"], "id": 6}, {"cat": "企業と法務", "q": "労働基準法における「36協定」の説明として適切なものはどれか。", "choices": ["時間外労働・休日労働を行わせる場合に労使間で締結する協定", "定年退職の年齢を定める協定", "賃金の支払い方法を定める協定", "有給休暇の日数を定める協定"], "ans": 0, "notes": ["正解。36協定を締結・届出することで法定時間を超える時間外労働などが可能になる。", "定年年齢は就業規則などで定められ、36協定の内容ではない。", "賃金支払方法は労働基準法の別の条項で規律される。", "有給休暇の日数も36協定の内容ではない。"], "id": 7}, {"cat": "企業と法務", "q": "国全体のサイバーセキュリティに関する施策の基本理念や体制を定めた法律はどれか。", "choices": ["個人情報保護法", "サイバーセキュリティ基本法", "不正アクセス禁止法", "特定電子メール法"], "ans": 1, "notes": ["個人情報保護法は個人情報の適正な取扱いを定める法律であり、国全体の施策の基本理念を定める法律ではない。", "正解。国のサイバーセキュリティ施策の基本となる事項を定める法律。", "不正アクセス禁止法は不正アクセス行為そのものを禁止する個別の法律であり、施策全体の基本法ではない。", "特定電子メール法は迷惑メール対策に関する法律であり、施策全体の基本法ではない。"], "id": 8}, {"cat": "企業と法務", "q": "「市場での競争の結果、事実上の標準として広く普及した規格」を指す用語はどれか。", "choices": ["デファクトスタンダード", "デジュレスタンダード", "フォーラム標準", "JISマーク表示制度"], "ans": 0, "notes": ["正解。市場競争の結果として広く普及した規格をデファクトスタンダードという。", "公的な標準化団体が正式な手続きを経て策定する規格はデジュレスタンダードと呼ばれる。", "業界団体などが共同で策定する規格はフォーラム標準と呼ばれる。", "JISマーク表示制度は日本の産業規格に適合した製品を示す制度で、成立過程による分類とは異なる。"], "id": 9}, {"cat": "経営戦略", "q": "SWOT分析における「S」が表すものはどれか。", "choices": ["Strength（強み）", "Strategy（戦略）", "System（体系）", "Sales（販売）"], "ans": 0, "notes": ["正解。SWOTはStrength・Weakness・Opportunity・Threatの頭文字。", "戦略（Strategy）はSWOT分析の構成要素ではない。", "Systemも構成要素ではない。", "Salesも構成要素ではない。"], "id": 10}, {"cat": "経営戦略", "q": "他社の株式を取得するなどして企業の合併・買収を行うことを表す略語はどれか。", "choices": ["OEM", "M&A", "SCM", "CRM"], "ans": 1, "notes": ["OEMは相手先ブランドでの製造受託を指す。", "正解。M&Aは Mergers and Acquisitions（合併・買収）の略。", "SCMはサプライチェーンマネジメントの略。", "CRMは顧客関係管理の略。"], "id": 11}, {"cat": "経営戦略", "q": "市場全体を細分化し、共通のニーズを持つ特定の顧客層に絞って展開するマーケティング手法はどれか。", "choices": ["マスマーケティング", "セグメントマーケティング", "ダイレクトマーケティング", "インバウンドマーケティング"], "ans": 1, "notes": ["マスマーケティングは市場を細分化せず画一的に展開する手法。", "正解。市場を細分化し、共通ニーズを持つ層に向けて展開する手法をセグメントマーケティングという。", "ダイレクトマーケティングは顧客に直接働きかける手法で、市場細分化そのものを指す言葉ではない。", "インバウンドマーケティングは顧客からの関心を引き寄せる手法であり、市場細分化の考え方とは異なる。"], "id": 12}, {"cat": "経営戦略", "q": "バランススコアカード（BSC）の説明として適切なものはどれか。", "choices": ["財務の視点だけで業績を評価する手法", "財務・顧客・業務プロセス・学習と成長の4つの視点で経営を評価する手法", "株価を分析する手法", "従業員満足度を測定する手法"], "ans": 1, "notes": ["財務指標のみに偏らないのがBSCの特徴。", "正解。4つの視点をバランスよく評価する経営管理手法がBSC。", "株価分析はBSCの目的ではない。", "従業員満足度の測定はBSCの一部の視点に関係するが、それ単体を指す言葉ではない。"], "id": 13}, {"cat": "経営戦略", "q": "技術経営を表す略語MOTの意味として適切なものはどれか。", "choices": ["Management Of Technology", "Method Of Testing", "Marketing Of Technology", "Model Of Training"], "ans": 0, "notes": ["正解。MOTはManagement Of Technology（技術経営）の略。", "テスト手法を表す用語ではない。", "マーケティング分野の略語ではない。", "研修モデルを表す略語ではない。"], "id": 14}, {"cat": "経営戦略", "q": "販売時点で商品情報や売上情報を記録・集計するシステムはどれか。", "choices": ["POSシステム", "CRMシステム", "需要予測システム", "在庫管理システム"], "ans": 0, "notes": ["正解。POS（Point of Sales）は販売時点情報管理システムのこと。", "顧客との関係を一元管理し営業活動を支援するのはCRM（顧客関係管理）システムの役割。", "需要予測に基づき発注量を決定するのは需要予測システムの役割。", "入出荷を管理し在庫を最適化するのは在庫管理システムの役割。"], "id": 15}, {"cat": "経営戦略", "q": "IoTシステムの活用例として適切なものはどれか。", "choices": ["紙の書類で在庫を管理すること", "センサーで取得したデータをネットワーク経由で収集・活用すること", "電話で注文を受け付けること", "手作業で生産管理を行うこと"], "ans": 1, "notes": ["紙の書類による管理はIoTの活用例ではない。", "正解。センサーとネットワークを組み合わせたデータ活用がIoTの代表例。", "電話による受付はIoTと無関係。", "手作業による管理はIoTの活用例ではない。"], "id": 16}, {"cat": "システム戦略", "q": "情報システム戦略の目的として最も適切なものはどれか。", "choices": ["経営戦略や事業戦略を実現するために情報システムを構築すること", "情報システムの構築・運用に関する年間予算を削減すること", "業務プロセスをすべてパッケージソフトウェアに置き換えること", "情報システム部門の組織図を策定すること"], "ans": 0, "notes": ["正解。情報システム戦略は経営戦略・事業戦略の実現を目的として立案される。", "予算削減自体が目的ではなく、投資判断の一要素にすぎない。", "パッケージ化はシステム化の一手段であり、目的そのものではない。", "組織図の策定は情報システム戦略の一部の活動にすぎず、目的そのものではない。"], "id": 17}, {"cat": "システム戦略", "q": "業務プロセスを可視化するための代表的なモデリング手法はどれか。", "choices": ["SWOT分析", "E-R図", "PDCA", "BSC"], "ans": 1, "notes": ["SWOT分析は経営環境の分析手法。", "正解。E-R図はデータの関連を可視化するモデリング手法の一つとして業務分析にも用いられる。", "PDCAは業務改善のサイクル。", "BSCは経営評価の手法。"], "id": 18}, {"cat": "システム戦略", "q": "クラウドサービスの提供形態のうち、アプリケーションソフトウェアの機能を提供するものはどれか。", "choices": ["IaaS", "PaaS", "SaaS", "DaaS"], "ans": 2, "notes": ["IaaSはインフラ（サーバーやストレージ）を提供する形態。", "PaaSはアプリケーション実行基盤を提供する形態。", "正解。SaaS（Software as a Service）はアプリケーションソフトウェアの機能そのものを提供する。", "DaaSはデスクトップ環境を提供する形態。"], "id": 19}, {"cat": "システム戦略", "q": "情報提供依頼（RFI）の説明として適切なものはどれか。", "choices": ["ベンダー企業に対し、システム化の目的や業務概要を示して情報提供を依頼すること", "ベンダー企業に対し、導入システムの概要や提案依頼事項、調達条件などを明示し提案書の提出を依頼すること", "受注者から提出された、システム構成や開発手法などの提案内容", "調達条件や費用を示した見積書"], "ans": 0, "notes": ["正解。RFIはRFP作成に先立ち、技術動向などの情報提供をベンダーに依頼する文書。", "これはRFP（提案依頼書）の説明であり、RFIより後の工程で使われる文書。", "これは提案書の説明であり、ベンダーがRFPを受けて作成する文書。", "これは見積書の説明であり、RFIとは異なる文書。"], "id": 20}, {"cat": "システム戦略", "q": "要件定義における「非機能要件」に該当するものはどれか。", "choices": ["システムが備えるべき機能の一覧", "システムの性能や可用性、セキュリティなどの品質に関する要件", "開発チームのメンバー構成", "契約金額"], "ans": 1, "notes": ["機能の一覧は「機能要件」に該当する。", "正解。性能・可用性・セキュリティなど、機能以外の品質面の要件が非機能要件。", "メンバー構成は要件定義の対象外。", "契約金額も要件定義そのものの対象外。"], "id": 21}, {"cat": "開発技術", "q": "ソフトウェア開発における「単体テスト」の説明として適切なものはどれか。", "choices": ["個々のプログラムに誤りがないかを確認するテスト", "結合したプログラム間のインタフェースを検証するテスト", "利用者が実際の業務で使用して確認するテスト", "要件定義の内容を関係者間でレビューすること"], "ans": 0, "notes": ["正解。単体テストはプログラムを個々に検証する工程。", "結合したプログラム間の検証は結合（統合）テストの役割。", "利用者による確認は受入れテストの役割。", "要件定義の内容を確認するのは共同レビューの役割。"], "id": 22}, {"cat": "開発技術", "q": "アジャイル開発における短い開発サイクルの単位を表す用語はどれか。", "choices": ["スプリント", "マイルストーン", "ロードマップ", "フェーズ"], "ans": 0, "notes": ["正解。スクラムなどのアジャイル開発では、短い反復期間をスプリントと呼ぶ。", "マイルストーンは進捗管理上の節目を指す。", "ロードマップは中長期の計画を示すもの。", "フェーズはウォーターフォール型の工程区分に近い概念。"], "id": 23}, {"cat": "開発技術", "q": "ウォーターフォールモデルの特徴として適切なものはどれか。", "choices": ["各工程を順番に進め、後戻りを想定しない開発モデル", "短い期間で開発と改善を繰り返すモデル", "試作品を作りながら要件を固めるモデル", "設計とテストを同時並行で進めるモデル"], "ans": 0, "notes": ["正解。要件定義から設計・開発・テストへと順に進める開発モデル。", "反復開発はアジャイルやスパイラルモデルの特徴。", "試作品を用いるのはプロトタイピングモデル。", "設計とテストを並行して進める手法という定義は存在せず、ウォーターフォールモデルの特徴とは異なる。"], "id": 24}, {"cat": "開発技術", "q": "リファクタリングの説明として最も適切なものはどれか。", "choices": ["プログラムの外部から見た動作を変えずに内部構造を改善すること", "新しい機能を追加すること", "バグを検出するためにテストケースを網羅的に作成すること", "開発工程をアジャイル型に全面的に切り替えること"], "ans": 0, "notes": ["正解。外部の振る舞いを変えずにコードの内部品質を高める作業をリファクタリングという。", "機能追加はリファクタリングの目的ではない。", "テストケースの作成はテスト活動であり、リファクタリングそのものではない。", "開発手法の全面的な変更とは無関係。"], "id": 25}, {"cat": "開発技術", "q": "CMMI（能力成熟度モデル統合）の説明として最も適切なものはどれか。", "choices": ["システム開発組織のプロセス成熟度を段階的に評価・改善すること", "ソフトウェアの品質特性を定義すること", "プロジェクトの進捗をガントチャートで管理すること", "開発規模をファンクションポイント法で見積もること"], "ans": 0, "notes": ["正解。CMMIは開発・保守プロセスの成熟度を段階的に評価・改善するモデル。", "品質特性の定義はISO/IEC 25010などの品質モデルの役割。", "ガントチャートによる進捗管理はプロジェクトマネジメントの一手法。", "ファンクションポイント法は開発規模の見積り手法であり、CMMIとは異なる。"], "id": 26}, {"cat": "プロジェクトマネジメント", "q": "WBS（Work Breakdown Structure）の説明として適切なものはどれか。", "choices": ["プロジェクトの作業を階層的に分解して整理したもの", "プロジェクトの予算を示したもの", "プロジェクトの体制図（責任分担）を示したもの", "プロジェクトのスケジュールを時系列に示したもの"], "ans": 0, "notes": ["正解。WBSはプロジェクトの作業を階層的に分解して管理しやすくしたもの。", "予算を示すものではない。", "体制図（責任分担）を示すものではない。", "時系列のスケジュールを示すのはガントチャートの役割。"], "id": 27}, {"cat": "プロジェクトマネジメント", "q": "プロジェクトのリスクへの対応策のうち、リスクの発生確率や影響度を小さくする対応はどれか。", "choices": ["回避", "軽減", "受容", "転嫁"], "ans": 1, "notes": ["回避はリスクの原因そのものを取り除く対応。", "正解。軽減はリスクの発生確率や影響を小さくする対応。", "受容はリスクをそのまま受け入れる対応。", "転嫁は保険などでリスクを他者に移す対応。"], "id": 28}, {"cat": "プロジェクトマネジメント", "q": "ガントチャートの用途として適切なものはどれか。", "choices": ["プロジェクトのスケジュールを視覚的に表現すること", "作業の依存関係と最短所要期間を明らかにすること", "作業を階層的に分解して整理すること", "リスクの発生確率と影響度を一覧化すること"], "ans": 0, "notes": ["正解。ガントチャートは作業ごとの開始・終了時期を横棒で示すスケジュール管理図。", "作業の依存関係と最短所要期間を明らかにするのはアローダイアグラム（PERT図）の役割。", "作業を階層的に分解して整理するのはWBSの役割。", "リスクの一覧化はリスクマトリクスなどの役割。"], "id": 29}, {"cat": "プロジェクトマネジメント", "q": "プロジェクトマネージャの役割として最も適切なものはどれか。", "choices": ["プロジェクトの進捗・コスト・品質・資源を管理し、目標達成を図ること", "要件定義からリリースまでの技術的な実装作業をすべて自ら行うこと", "顧客からの日常的な問合せに個別対応するサービスデスク業務を行うこと", "プロジェクト完了後の製品の長期的なマーケティング戦略を立案すること"], "ans": 0, "notes": ["正解。進捗・コスト・品質・資源などを総合的に管理し目標達成を図るのが役割。", "実装作業はプロジェクトメンバー（開発者）の役割であり、PM単独の役割ではない。", "日常的な問合せ対応はサービスデスクの役割。", "長期マーケティング戦略の立案はPMの役割ではない。"], "id": 30}, {"cat": "サービスマネジメント", "q": "SLA（サービスレベル合意書）の説明として適切なものはどれか。", "choices": ["サービスの品質や範囲について組織と顧客の間で合意した文書", "組織内の部門間でサービス水準を取り決めた合意文書", "サービスの利用状況を示す実績レポート", "サービスに関する問合せ対応の手順を示したマニュアル"], "ans": 0, "notes": ["正解。SLAはサービス提供者と顧客の間でサービス水準を取り決めた合意文書。", "組織内部門間の合意はOLA（Operational Level Agreement）と呼ばれ、SLAとは異なる。", "実績レポートはSLAの遵守状況を確認する材料の一つであり、SLAそのものではない。", "対応手順のマニュアルとSLAは別の文書。"], "id": 31}, {"cat": "サービスマネジメント", "q": "ITILの説明として最も適切なものはどれか。", "choices": ["サービスマネジメントに関するベストプラクティスをまとめたフレームワーク", "品質マネジメントシステムに関する国際規格", "情報セキュリティマネジメントシステムに関する国際規格", "プロジェクトマネジメントの知識体系をまとめたガイド"], "ans": 0, "notes": ["正解。ITILはサービスマネジメントのベストプラクティス集。", "品質マネジメントの国際規格はISO 9000。", "情報セキュリティマネジメントの国際規格はISO/IEC 27000。", "プロジェクトマネジメントの知識体系はPMBOKと呼ばれる。"], "id": 32}, {"cat": "サービスマネジメント", "q": "サービスデスクの役割として適切なものはどれか。", "choices": ["利用者からの問合せに対する単一の窓口機能を提供すること", "システムの構成情報を一元管理すること", "変更要求を審査し、リリースの可否を判断すること", "サービスの品質を継続的に改善する活動全体を統括すること"], "ans": 0, "notes": ["正解。サービスデスクは利用者からの問合せに対するSPOC（単一窓口）を提供する。", "構成情報の一元管理は構成管理の役割。", "変更の審査・可否判断は変更管理の役割。", "継続的改善の統括はサービスマネジメント全体のPDCA活動であり、サービスデスク単体の役割ではない。"], "id": 33}, {"cat": "サービスマネジメント", "q": "システム監査の目的として最も適切なものはどれか。", "choices": ["情報システムに関わるリスクへの対応状況を独立した立場から検証・評価すること", "情報システムの企画・開発を効率的に進めるための技術支援を行うこと", "内部統制の整備状況を経営者自身が自己点検すること", "情報システムの運用を外部委託先に一任すること"], "ans": 0, "notes": ["正解。独立かつ客観的な立場から情報システムリスクへの対応状況を検証・評価するのがシステム監査の目的。", "技術支援はコンサルティングなどの役割であり、独立した検証・評価を旨とするシステム監査とは異なる。", "経営者自身による自己点検は内部統制の一部の活動であり、独立した第三者による監査とは異なる。", "外部委託先への一任はシステム監査の目的ではない。"], "id": 34}, {"cat": "サービスマネジメント", "q": "内部統制の目的として適切なものはどれか。", "choices": ["健全かつ効率的な組織運営のための体制を構築・運用すること", "経営者の意思決定を外部監査人がすべて代行すること", "業務プロセスの効率化のみを目的として職務分掌を廃止すること", "法令順守状況を年に一度だけ確認すること"], "ans": 0, "notes": ["正解。内部統制は健全・効率的な組織運営のための体制を自ら構築・運用する仕組み。", "意思決定の代行は内部統制の目的ではなく、経営者自身の責任である。", "職務分掌はむしろ内部統制上重要な仕組みであり、廃止することは目的に反する。", "内部統制は継続的な取組みであり、年1回の確認に限定されるものではない。"], "id": 35}, {"cat": "サービスマネジメント", "q": "UPS（無停電電源装置）の役割として最も適切なものはどれか。", "choices": ["停電時に一時的に電力を供給し、システムの停止や損傷を防ぐこと", "停電が長時間続く場合に主要な電力源として稼働し続けること", "電力の周波数や電圧の変動を完全に無くすこと", "サージ（瞬間的な過電圧）から機器を完全に保護すること"], "ans": 0, "notes": ["正解。UPSは停電時に一時的な電力供給を行い、システムを安全に停止・保護する装置。", "長時間の主要電力源としての役割は自家発電装置が担うことが多く、UPSは短時間の橋渡しが主な役割。", "「完全に無くす」とまでは言えず、変動を緩和する役割にとどまる。", "サージ対策は別途サージ防護の仕組みが必要であり、UPSの主目的ではない。"], "id": 36}, {"cat": "基礎理論", "q": "2進数の1010を10進数に変換した値はどれか。", "choices": ["8", "9", "10", "12"], "ans": 2, "notes": ["8ではない。1010(2)=8+0+2+0=10。", "9でもない。", "正解。1010(2) = 1×8 + 0×4 + 1×2 + 0×1 = 10。", "12でもない。"], "id": 37}, {"cat": "基礎理論", "q": "論理演算において、両方の入力が真のときのみ真となる演算はどれか。", "choices": ["AND", "OR", "NOT", "XOR"], "ans": 0, "notes": ["正解。AND演算は両方が真のときのみ真になる。", "OR演算はどちらか一方でも真なら真になる。", "NOTは入力を反転させる演算。", "XORは入力が異なるときに真になる演算。"], "id": 38}, {"cat": "基礎理論", "q": "平均値・中央値・最頻値をまとめて表す用語はどれか。", "choices": ["代表値", "分散", "標準偏差", "相関係数"], "ans": 0, "notes": ["正解。データ全体の特徴を1つの値で表す指標をまとめて代表値と呼ぶ。", "分散はデータのばらつきを表す指標。", "標準偏差も分散に基づくばらつきの指標。", "相関係数は2つの変数の関係の強さを表す指標。"], "id": 39}, {"cat": "基礎理論", "q": "コンピュータが扱う情報量の最小単位はどれか。", "choices": ["バイト", "ビット", "ワード", "ブロック"], "ans": 1, "notes": ["バイトは通常8ビットをまとめた単位。", "正解。ビットは情報量の最小単位（0か1）。", "ワードはCPUが一度に処理するデータ単位。", "ブロックはデータをまとめた単位で最小単位ではない。"], "id": 40}, {"cat": "基礎理論", "q": "正解ラベル付きのデータを用いて学習する機械学習の手法はどれか。", "choices": ["教師あり学習", "教師なし学習", "強化学習", "半教師あり学習"], "ans": 0, "notes": ["正解。入力とその正解（ラベル）の組を使って学習するのが教師あり学習。", "ラベルなしでの構造発見は教師なし学習。", "報酬最大化による学習は強化学習。", "半教師あり学習はラベル付きデータとラベルなしデータの両方を組み合わせる手法。"], "id": 41}, {"cat": "基礎理論", "q": "アルゴリズムの基本構造として適切な組合せはどれか。", "choices": ["順次・選択・繰返し", "加算・減算・乗算", "入力・出力", "暗号化・復号"], "ans": 0, "notes": ["正解。アルゴリズムは順次・選択・繰返しの3つの基本構造の組合せで表現できる。", "四則演算は個々の処理であり基本構造ではない。", "入力・出力だけでは制御構造を表せない。", "暗号化・復号はセキュリティ分野の用語で基本構造ではない。"], "id": 42}, {"cat": "基礎理論", "q": "2分探索法の特徴として適切なものはどれか。", "choices": ["データが整列されていることを前提に、探索範囲を半分ずつ絞り込んで検索する", "先頭から順に1件ずつ確認していく", "データを整列させる手法である", "常にデータの末尾から検索する"], "ans": 0, "notes": ["正解。整列済みデータに対して中央値と比較しながら範囲を半分ずつに絞り込む探索法。", "先頭から順に確認するのは線形探索法の特徴。", "整列自体を行う手法ではなく、整列済みデータを前提とする探索法。", "末尾からの探索とは限らない。"], "id": 43}, {"cat": "コンピュータシステム", "q": "コンピュータの五大機能に含まれないものはどれか。", "choices": ["演算", "制御", "記憶", "課金"], "ans": 3, "notes": ["演算は五大機能の一つ。", "制御も五大機能の一つ。", "記憶も五大機能の一つ。", "正解。五大機能は演算・制御・記憶・入力・出力であり、課金は含まれない。"], "id": 44}, {"cat": "コンピュータシステム", "q": "揮発性メモリの特徴として適切なものはどれか。", "choices": ["電源を切るとデータが消える", "電源を切ってもデータが保持される", "読み込み専用である", "書き込み速度がHDDより遅い"], "ans": 0, "notes": ["正解。揮発性メモリ（例：DRAM）は電源が切れるとデータが失われる。", "電源を切ってもデータが保持されるのは不揮発性メモリの特徴。", "読み込み専用（ROM的な特性）とは異なる。", "一般にメモリはHDDより高速。"], "id": 45}, {"cat": "コンピュータシステム", "q": "RAIDの目的として最も適切なものはどれか。", "choices": ["複数のディスクを組み合わせて信頼性や性能を高めること", "主記憶とキャッシュメモリの間でデータをやり取りする仕組みを作ること", "仮想化技術を用いて1台の物理サーバ上に複数のOS環境を構築すること", "ネットワーク経由でファイルを共有するための専用ストレージ装置を導入すること"], "ans": 0, "notes": ["正解。RAIDは複数のディスクを組み合わせ、信頼性や読み書き性能を向上させる技術。", "記憶階層（キャッシュメモリと主記憶の関係）とは異なる概念。", "1台の物理サーバに複数OSを構築するのは仮想化（VMなど）の役割。", "ネットワーク経由の専用共有ストレージはNASの説明であり、RAIDそのものとは異なる。"], "id": 46}, {"cat": "コンピュータシステム", "q": "システムの信頼性を表す指標であるMTBFの意味として適切なものはどれか。", "choices": ["平均故障間動作時間", "平均修復時間", "稼働率", "応答時間"], "ans": 0, "notes": ["正解。MTBF（Mean Time Between Failures）は故障から次の故障までの平均動作時間。", "平均修復時間はMTTR。", "稼働率は別の指標。", "応答時間（レスポンスタイム）も別の指標。"], "id": 47}, {"cat": "コンピュータシステム", "q": "フェールセーフの考え方として適切なものはどれか。", "choices": ["故障が発生した際に、被害を最小限に抑える安全な状態に移行する設計思想", "故障が発生しても機能を維持し、システム全体を停止させない設計思想", "利用者の誤操作があってもシステムに影響を与えない設計思想", "故障が発生する前提を置かず、信頼性の高い部品のみで構成する設計思想"], "ans": 0, "notes": ["正解。フェールセーフは故障時に安全側へ制御することを重視する設計思想。", "故障時にも機能を維持し続けようとする考え方はフォールトトレラントの説明。", "誤操作を許容する設計はフールプルーフの考え方。", "故障が起きないことを前提とする考え方はフェールセーフとは異なる。"], "id": 48}, {"cat": "コンピュータシステム", "q": "クライアントサーバシステムの説明として適切なものはどれか。", "choices": ["サービスを提供するサーバと、それを利用するクライアントで構成されるシステム", "複数の利用者からの処理要求を1台のコンピュータで順に処理するシステム", "同等の機能を持つコンピュータ同士が直接データをやり取りする方式", "複数のコンピュータで同一の処理を同時に実行し結果を照合するシステム"], "ans": 0, "notes": ["正解。サービスを提供するサーバと利用するクライアントに役割を分担する構成。", "1台のコンピュータで順に処理するのは集中処理の説明。", "対等な立場で直接データをやり取りするのはピアツーピア方式の説明。", "同一処理を同時実行し結果を照合するのはデュアルシステムの説明。"], "id": 49}, {"cat": "技術要素", "q": "ユニバーサルデザインの考え方として適切なものはどれか。", "choices": ["年齢や障害の有無などにかかわらず、多くの人が快適に利用できることを目指す考え方", "障害のある人が利用する際の障壁を取り除くことに特化した考え方", "高齢者や障害者などを対象に必要な機能を個別に付加する考え方", "特定の年齢層を対象にした設計"], "ans": 0, "notes": ["正解。年齢や能力の違いによらず、できる限り多くの人が使いやすいことを目指す考え方。", "障壁の除去に特化した考え方はバリアフリーの説明に近い。", "個別に機能を付加する考え方はアクセシビリティ対応に近く、最初から誰もが使えるよう設計するユニバーサルデザインとは前提が異なる。", "特定層限定の設計はユニバーサルデザインの趣旨に反する。"], "id": 50}, {"cat": "技術要素", "q": "可逆圧縮の説明として適切なものはどれか。", "choices": ["圧縮前のデータに完全に復元できる圧縮方式", "圧縮すると元のデータには戻せない圧縮方式", "圧縮率が常に100％になる方式", "音声データにのみ使われる方式"], "ans": 0, "notes": ["正解。可逆圧縮は伸長すると元のデータに完全に復元できる方式。", "元に戻せないのは非可逆圧縮の特徴。", "圧縮率が100％になるわけではない。", "音声に限らず様々なデータに使われる。"], "id": 51}, {"cat": "技術要素", "q": "データベースにおける「主キー」の役割として最も適切なものはどれか。", "choices": ["テーブル内の各レコードを一意に識別するための項目", "他のテーブルのレコードを参照するための項目", "検索処理を高速化するために作成する索引", "データの正規化により重複を排除する処理"], "ans": 0, "notes": ["正解。主キーはテーブル内の各行（レコード）を一意に識別するための項目。", "他のテーブルを参照するための項目は外部キーの説明。", "検索を高速化する索引はインデックスの説明。", "重複排除の処理は正規化の説明。"], "id": 52}, {"cat": "技術要素", "q": "関係データベースのデータ操作のうち、条件に合うレコードを取り出す操作はどれか。", "choices": ["更新", "選択", "射影", "結合"], "ans": 1, "notes": ["更新は既存レコードの内容を変更する操作。", "正解。選択は指定した条件に合致する行を抽出する操作。", "射影は指定した列（属性）を取り出す操作。", "結合は複数のテーブルを関連付けて1つの表にする操作。"], "id": 53}, {"cat": "技術要素", "q": "トランザクション処理における排他制御の目的として適切なものはどれか。", "choices": ["複数の利用者が同時にデータへアクセスした際の整合性を確保すること", "障害発生時に直前の状態までデータを復旧すること", "処理をコミット前の状態に戻すことなく確定させること", "一定間隔でデータのバックアップを取得し世代管理すること"], "ans": 0, "notes": ["正解。排他制御は同時アクセス時のデータ整合性を確保するための仕組み。", "障害発生時の復旧はロールバックなど障害回復の役割。", "処理の確定はコミットの役割であり、排他制御そのものではない。", "バックアップの世代管理は障害回復に備えた別の仕組み。"], "id": 54}, {"cat": "技術要素", "q": "LANとWANの違いとして適切なものはどれか。", "choices": ["LANは限られた範囲内のネットワーク、WANは広域にわたるネットワーク", "LANは無線、WANは有線のネットワーク", "LANは全国規模、WANは同一フロア内など極めて狭い範囲を指すネットワーク", "両者に違いはない"], "ans": 0, "notes": ["正解。LANは建物内など限定範囲、WANは複数拠点をまたぐ広域のネットワークを指す。", "有線・無線の別による区分ではない。", "実際には逆で、LANが狭い範囲、WANが広域のネットワークを指す。", "両者は明確に異なる概念。"], "id": 55}, {"cat": "技術要素", "q": "HTTPSの説明として適切なものはどれか。", "choices": ["HTTP通信をSSL/TLSで暗号化したプロトコル", "メールを送信するためのプロトコル", "ファイルを転送するためのプロトコル", "時刻を同期するためのプロトコル"], "ans": 0, "notes": ["正解。HTTPSはHTTP通信をSSL/TLSで暗号化し安全性を高めたプロトコル。", "メール送信用のプロトコルはSMTP。", "ファイル転送用のプロトコルはFTP。", "時刻同期用のプロトコルはNTP。"], "id": 56}, {"cat": "技術要素", "q": "IPアドレスの役割として適切なものはどれか。", "choices": ["ネットワーク上の機器を識別するための番号", "ドメイン名を人間が読みやすい文字列に変換するための仕組み", "データの伝送経路を選択するための仕組み", "通信相手のアプリケーションを識別するための番号"], "ans": 0, "notes": ["正解。IPアドレスはネットワーク上の機器を一意に識別するための番号。", "ドメイン名との変換を行うのはDNSの役割。", "伝送経路の選択はルーティングの役割。", "アプリケーションの識別はポート番号の役割。"], "id": 57}, {"cat": "技術要素", "q": "ランサムウェアの説明として最も適切なものはどれか。", "choices": ["データを暗号化するなどして人質にとり、復旧と引き換えに金銭を要求するマルウェア", "正規のソフトウェアになりすまして侵入し、外部から遠隔操作を可能にするマルウェア", "自己増殖しながらネットワークを介して他のコンピュータに感染を広げるマルウェア", "利用者の入力操作を記録し外部に送信するマルウェア"], "ans": 0, "notes": ["正解。ランサムウェアはデータを暗号化するなどして身代金を要求するマルウェア。", "正規ソフトへのなりすましによる遠隔操作の説明はトロイの木馬に近い。", "自己増殖して感染を広げる説明はワームに近い。", "入力操作の記録・送信の説明はキーロガーに近い。"], "id": 58}, {"cat": "技術要素", "q": "SQLインジェクションの説明として適切なものはどれか。", "choices": ["Webアプリケーションの入力欄に不正なSQL文を注入し、データベースを不正に操作する攻撃", "Webページに悪意のあるスクリプトを埋め込み、閲覧者のブラウザ上で実行させる攻撃", "大量のデータを送りつけてサーバを停止させる攻撃", "パスワードを総当たりで試す攻撃"], "ans": 0, "notes": ["正解。入力欄に不正なSQL文を注入し、データベースを不正に操作・閲覧する攻撃手法。", "スクリプトを埋め込みブラウザ上で実行させる攻撃はクロスサイトスクリプティングの説明。", "大量データによるサーバ停止はDoS攻撃の説明。", "総当たり攻撃はブルートフォース攻撃の説明。"], "id": 59}, {"cat": "技術要素", "q": "多要素認証の説明として最も適切なものはどれか。", "choices": ["知識情報・所持情報・生体情報のうち、2つ以上を組み合わせて本人確認を行う方式", "パスワードのみで認証を行う方式", "IDのみで認証を行う方式", "認証を一切行わない方式"], "ans": 0, "notes": ["正解。知識・所持・生体の情報のうち複数を組み合わせることで安全性を高める認証方式。", "パスワードのみは単要素認証にあたる。", "IDのみでは認証として不十分。", "認証を行わないのはセキュリティ上不適切。"], "id": 60}, {"cat": "技術要素", "q": "公開鍵暗号方式の特徴として適切なものはどれか。", "choices": ["暗号化と復号に異なる鍵を使用する方式", "暗号化と復号に同じ鍵を使用する方式", "公開鍵と共通鍵の両方を組み合わせて使用する方式", "入力データから固定長の値を生成し、原文の復元はできない方式"], "ans": 0, "notes": ["正解。公開鍵暗号方式は暗号化用と復号用に異なる鍵（公開鍵・秘密鍵）を用いる。", "同じ鍵を使うのは共通鍵暗号方式の特徴。", "公開鍵と共通鍵の組合せはハイブリッド暗号方式の説明。", "固定長の値を生成し復元できないのはハッシュ関数の説明。"], "id": 61}, {"cat": "技術要素", "q": "ファイアウォールの役割として最も適切なものはどれか。", "choices": ["組織内外の通信を監視し、不正な通信を遮断すること", "通信内容を解析し、既知の攻撃パターンを検知して管理者に通知すること", "検知した不正な通信を自動的に遮断するところまで行うこと", "Webアプリケーションへの攻撃に特化して防御すること"], "ans": 0, "notes": ["正解。ファイアウォールは内部と外部の通信を監視・制御し、不正な通信を遮断する仕組み。", "攻撃パターンを検知し通知するのはIDS（侵入検知システム）の役割。", "検知した不正通信の自動遮断まで行うのはIPS（侵入防止システム）の役割。", "Webアプリケーションに特化した防御はWAFの役割。"], "id": 62}, {"cat": "技術要素", "q": "ソーシャルエンジニアリングの説明として適切なものはどれか。", "choices": ["人の心理的な隙や行動のミスにつけ込んで情報を盗み取る手法", "特定の組織や個人を狙って業務関連の内容を装い不正ファイルを開かせる攻撃", "組織になりすましたメールで偽の送金先へ振り込ませる詐欺", "脆弱性が公表される前にその脆弱性を悪用する攻撃"], "ans": 0, "notes": ["正解。技術的手段ではなく、人の心理や行動の隙を突いて情報を盗み取る手法をいう。", "特定対象を狙った不正ファイル誘導は標的型攻撃の説明であり、より広い概念であるソーシャルエンジニアリングそのものの定義ではない。", "偽の送金先への誘導はビジネスメール詐欺の説明。", "脆弱性公表前の悪用はゼロデイ攻撃の説明。"], "id": 63}, {"cat": "企業と法務", "q": "「人的資本経営」の考え方として最も適切なものはどれか。", "choices": ["人材を「資本」ととらえ、その価値を引き出すことで中長期的な企業価値の向上につなげる経営のあり方", "人件費をできる限り削減する経営手法", "株主資本を重視する経営手法", "労働時間を厳格に管理するだけの制度"], "ans": 0, "notes": ["正解。人材を資本とみなし、その価値向上を通じて企業価値向上を目指す経営のあり方。", "人件費削減そのものを指す言葉ではない。", "株主資本のみに偏重した考え方ではない。", "労働時間管理の制度そのものではない。"], "id": 64}, {"cat": "企業と法務", "q": "DE&I（Diversity, Equity & Inclusion）の説明として最も適切なものはどれか。", "choices": ["多様性・公平性・包摂性を重視し、様々な人材が能力を発揮できる環境を目指す考え方", "女性管理職の比率のみを定量的な目標として設定する制度", "特定の属性の人材を積極的に採用する制度", "年功序列に基づいて人材を評価する制度"], "ans": 0, "notes": ["正解。多様な人材それぞれが公平に機会を得て能力を発揮できる環境づくりを目指す考え方。", "特定指標の目標設定はDE&Iの取組みの一部にすぎず、考え方全体を指す言葉ではない。", "特定属性に限定した採用制度を指す言葉ではない。", "年功序列的な評価とは異なる考え方。"], "id": 65}, {"cat": "企業と法務", "q": "「リスキリング」の説明として適切なものはどれか。", "choices": ["技術革新や事業内容の変化に対応するために、新たなスキルを学び直すこと", "定年退職者を再雇用する制度", "従業員の勤務地を変更すること", "業務を外部委託すること"], "ans": 0, "notes": ["正解。事業やIT環境の変化に対応するため、新しいスキルを習得し直すことをリスキリングという。", "再雇用制度とは別の概念。", "勤務地の変更とは無関係。", "外部委託（アウトソーシング）とは異なる。"], "id": 66}, {"cat": "企業と法務", "q": "2026年1月改訂のITパスポート試験シラバスVer.6.5で、「下請法」に代わり新たに追加された法律はどれか。", "choices": ["中小受託取引適正化法", "個人情報保護法", "不正競争防止法", "景品表示法"], "ans": 0, "notes": ["正解。取適法とも呼ばれ、中小受託事業者への代金支払遅延などを防止し利益を保護する法律。", "個人情報保護法は以前から法務分野に含まれる別の法律。", "不正競争防止法も別の法律。", "景品表示法も別の法律。"], "id": 67}, {"cat": "企業と法務", "q": "広告であるにもかかわらず広告であることを隠して行う「ステルスマーケティング」を主に規制する法律はどれか。", "choices": ["景品表示法", "特定商取引法", "消費者契約法", "独占禁止法"], "ans": 0, "notes": ["正解。大げさな表現や表示であることを隠した広告などを規制する法律として景品表示法がある。", "特定商取引法は訪問販売や通信販売などの取引形態を規律する法律。", "消費者契約法は契約における不当な勧誘などを規律する法律。", "独占禁止法は市場の公正な競争を確保する法律。"], "id": 68}, {"cat": "企業と法務", "q": "GX推進法が目的とする内容として最も適切なものはどれか。", "choices": ["グリーントランスフォーメーション（GX）を推進し、脱炭素社会の実現に向けた取組みを支援すること", "再生可能エネルギーの固定価格買取のみを目的とすること", "カーボンフットプリントの表示を全企業に義務付けること", "エネルギー基本計画の策定手続を定めること"], "ans": 0, "notes": ["正解。GX（グリーントランスフォーメーション）を推進し、カーボンニュートラルの実現を支援する法律。", "固定価格買取制度（FIT制度）は別の制度。", "表示の全企業への義務付けを直接定めるものではない。", "エネルギー基本計画の策定手続とは異なる法律。"], "id": 69}, {"cat": "経営戦略", "q": "「人間中心のAI社会原則」の考え方として最も適切なものはどれか。", "choices": ["AIをより良い形で社会実装するため、人間中心・公平性・説明責任・透明性などを重視する原則", "AIの開発をすべて禁止するための原則", "AIにすべての意思決定を委ねるための原則", "AIの利用者情報を無制限に収集してよいとする原則"], "ans": 0, "notes": ["正解。AI利活用に関する基本原則の一つで、人間中心や公平性・透明性などを重視する。", "AI開発の全面禁止を求めるものではない。", "AIに意思決定を丸投げする考え方ではない。", "利用者情報の無制限な収集を認めるものではない。"], "id": 70}, {"cat": "経営戦略", "q": "XAI（Explainable AI：説明可能なAI）の説明として適切なものはどれか。", "choices": ["AIがどのような根拠で判断・予測を行ったかを人間が理解できるようにする技術・考え方", "AIの学習に用いるデータの構造を自動的に最適化する技術", "AIモデルの推論を高速化するために演算処理を簡略化する技術", "AIの出力結果を自動的に多言語へ翻訳する技術"], "ans": 0, "notes": ["正解。AIの判断根拠を人間が理解できる形で示すことを目的とする技術・考え方。", "データ前処理の自動化とは異なる技術。", "軽量化・量子化などの高速化技術とは異なる。", "多言語翻訳とは無関係。"], "id": 71}, {"cat": "経営戦略", "q": "AIが、実在しない出来事や誤った情報をあたかも事実であるかのように出力してしまう現象を表す用語はどれか。", "choices": ["ハルシネーション", "アルゴリズムのバイアス", "ブラックボックス化", "プロンプトインジェクション"], "ans": 0, "notes": ["正解。AIが事実に基づかない内容をもっともらしく生成してしまう現象をハルシネーションという。", "アルゴリズムのバイアスは学習データの偏りによって不公平な判断をしてしまう現象。", "ブラックボックス化はAIの判断根拠が不透明になる現象。", "プロンプトインジェクションは悪意ある入力によりAIに意図しない挙動をさせる攻撃。"], "id": 72}, {"cat": "経営戦略", "q": "ディープフェイクの説明として最も適切なものはどれか。", "choices": ["AI技術を用いて実在の人物の映像や音声を加工し、あたかも本人が話したかのように見せる技術及びその悪用", "AIが学習データに存在しない新しいパターンを生成する技術全般", "AIが誤った情報をもっともらしく生成してしまう現象", "AIの判断根拠を人間が理解できるようにする技術"], "ans": 0, "notes": ["正解。AIで人物の映像・音声を精巧に加工・合成する技術で、悪用による偽情報拡散が問題視されている。", "生成AI全般を指す言葉ではなく、人物の映像・音声の加工に特化した技術・現象を指す。", "誤情報のもっともらしい生成はハルシネーションの説明。", "判断根拠の可視化はXAIの説明。"], "id": 73}, {"cat": "基礎理論", "q": "大規模言語モデル（LLM）の説明として最も適切なものはどれか。", "choices": ["大量のテキストデータを学習し、自然な文章の生成や理解を行うAIモデル", "画像データのみを対象に学習する専用の生成AIモデル", "音声データを対象にした音声認識専用のモデル", "数値データの回帰分析に特化した統計モデル"], "ans": 0, "notes": ["正解。LLM（Large Language Model）は大量のテキストを学習し、文章生成・理解などを行うAIモデル。", "画像専用の生成モデルとは異なる。", "音声認識専用モデルとは異なる。", "回帰分析専用の統計モデルとは異なる。"], "id": 74}, {"cat": "基礎理論", "q": "生成AIから望ましい出力を引き出すために、指示文を工夫することを表す用語はどれか。", "choices": ["プロンプトエンジニアリング", "ファインチューニング", "XAI", "ファクトチェック"], "ans": 0, "notes": ["正解。生成AIへの指示文（プロンプト）を工夫し、望む出力を得るための手法・工夫をいう。", "ファインチューニングは学習済みモデルを追加学習させる手法。", "XAIはAIの判断根拠を説明可能にする技術。", "ファクトチェックはAIの出力内容の事実確認を人が行う活動。"], "id": 75}, {"cat": "基礎理論", "q": "学習済みのAIモデルを、別の目的やデータに合わせて追加学習させる手法を表す用語はどれか。", "choices": ["ファインチューニング", "事前学習", "アンサンブル学習", "蒸留"], "ans": 0, "notes": ["正解。事前学習済みモデルを、特定の目的向けに追加学習させることをファインチューニングという。", "事前学習はゼロから大量データでモデルを学習させる段階を指す。", "アンサンブル学習は複数モデルの出力を統合して精度を高める手法。", "蒸留はモデルを軽量化する手法。"], "id": 76}, {"cat": "技術要素", "q": "ビジネスメール詐欺（BEC）の説明として最も適切なものはどれか。", "choices": ["取引先や経営者になりすましたメールを送り、偽の口座へ送金させるなどして金銭をだまし取る手口", "不特定多数に無差別にメールを送りつけ、偽サイトへ誘導して個人情報を盗む手口", "特定の組織や個人を狙い業務関連の内容を装い不正ファイルを開かせる手口", "乗っ取ったメールアカウントを使って同じ内容のメールを大量に転送し続ける行為"], "ans": 0, "notes": ["正解。取引先や経営者になりすまし、偽の送金指示などで金銭をだまし取る詐欺の手口。", "不特定多数への無差別な誘導はフィッシングの説明。", "特定対象への不正ファイル誘導は標的型攻撃の説明。", "大量転送の説明はチェーンメールに近い。"], "id": 77}, {"cat": "技術要素", "q": "「二重脅迫（ダブルエクストーション）」の説明として適切なものはどれか。", "choices": ["データを暗号化して身代金を要求すると同時に、盗んだ情報の公開もちらつかせて脅迫する手口", "暗号化したデータの復号鍵を提供する代わりに金銭を要求するだけの手口", "攻撃対象のシステムを完全に破壊し、データ復旧を不可能にする攻撃", "攻撃者が身元を明かした上で金銭を要求する行為"], "ans": 0, "notes": ["正解。暗号化による脅迫に加え、窃取した情報の公開をちらつかせる二段構えの脅迫手口。", "復号鍵と引き換えに金銭を要求するだけの手口は従来型のランサムウェアに近く、「二重」の要素を含まない。", "完全破壊型の攻撃とは異なる。", "身元を明かした脅迫という点は本質的な違いではない。"], "id": 78}, {"cat": "技術要素", "q": "ファイルレスマルウェアの特徴として最も適切なものはどれか。", "choices": ["悪意のあるファイルをディスクに保存せず、正規のプログラムなどを悪用して動作するマルウェア", "ファイルを一切使わずネットワークにも一切接続しないマルウェア", "データを暗号化して復元不能にするマルウェア全般の総称", "ファイル共有ソフトを介して感染するマルウェア"], "ans": 0, "notes": ["正解。ディスクに実体ファイルを残さず、正規のツールなどを悪用して動作を行うマルウェア。", "ネットワークに一切接続しないという特徴ではない。", "暗号化型マルウェア全般を指す言葉ではない（それはランサムウェア）。", "ファイル共有ソフト経由に限定されるものではない。"], "id": 79}, {"cat": "技術要素", "q": "生成AIに対して悪意ある指示文を紛れ込ませ、開発者の意図しない出力をさせようとする攻撃はどれか。", "choices": ["プロンプトインジェクション攻撃", "SQLインジェクション", "クロスサイトスクリプティング", "ブルートフォース攻撃"], "ans": 0, "notes": ["正解。生成AIへの入力に不正な指示を混入させ、意図しない挙動を引き起こす攻撃。", "SQLインジェクションはデータベースを狙う別の攻撃。", "クロスサイトスクリプティングはWebページに悪意あるスクリプトを埋め込む攻撃。", "ブルートフォース攻撃はパスワードを総当たりで試す攻撃。"], "id": 80}, {"cat": "技術要素", "q": "パスワードを使わず、生体情報やデバイスの所持などによって本人確認を行う認証方式はどれか。", "choices": ["パスワードレス認証", "ワンタイムパスワード", "シングルサインオン", "リスクベース認証"], "ans": 0, "notes": ["正解。パスワードに依存せず、生体情報や所持デバイスなどで本人確認を行う認証方式。", "ワンタイムパスワードは都度発行される使い捨てパスワードを用いる方式。", "シングルサインオンは1度の認証で複数サービスを利用できる仕組み。", "リスクベース認証は状況に応じて認証強度を変える方式。"], "id": 81}, {"cat": "技術要素", "q": "「3-2-1ルール」が示すバックアップの考え方として最も適切なものはどれか。", "choices": ["データを3つ以上のコピーとして保持し、2種類以上の異なる媒体に保存し、うち1つは遠隔地に保管するという考え方", "3人以上の承認を得てから復旧作業を行うルール", "3日に1回、2時間かけて1つのファイルをバックアップするルール", "パスワードを3回間違えると2分間ロックし、1回だけ再試行を許可するルール"], "ans": 0, "notes": ["正解。データ喪失リスクに備えた代表的なバックアップの考え方。", "承認プロセスに関するルールではない。", "具体的な頻度・時間を定めたルールではない。", "ログイン制限のルールとは無関係。"], "id": 82}, {"cat": "企業と法務", "q": "ある商品の販売単価は2,000円、1個当たりの変動費は1,200円、月間の固定費は240万円である。この商品を月に4,000個販売したときの営業利益はどれか。", "choices": ["80万円", "320万円", "160万円", "40万円"], "ans": 0, "notes": ["正解。1個当たりの限界利益は2,000-1,200=800円。4,000個分の限界利益は800×4,000=320万円。ここから固定費240万円を引くと営業利益は80万円。", "320万円は固定費を差し引く前の限界利益の合計であり、営業利益ではない。", "160万円は固定費を正しく差し引いていない誤った計算による値。", "40万円は固定費の一部のみを差し引くなどした誤った計算による値。"], "id": 83}, {"cat": "企業と法務", "q": "固定費が900万円、商品1個当たりの販売価格が5,000円、1個当たりの変動費が3,500円であるとき、損益分岐点となる販売数量はどれか。", "choices": ["6,000個", "1,800個", "2,571個", "12,000個"], "ans": 0, "notes": ["正解。損益分岐点の販売数量＝固定費÷（販売価格－変動費）＝9,000,000円÷(5,000円－3,500円)＝9,000,000÷1,500＝6,000個。", "1,800個は固定費を販売価格だけで割った誤った計算による値。", "2,571個は固定費を変動費だけで割った誤った計算による値。", "12,000個は限界利益を2倍にするなどした誤った計算による値。"], "id": 84}, {"cat": "企業と法務", "q": "売上高が5,000万円、売上原価が3,000万円、販売費及び一般管理費が1,200万円、営業外収益が100万円、営業外費用が50万円であるとき、経常利益はどれか。", "choices": ["850万円", "800万円", "900万円", "750万円"], "ans": 0, "notes": ["正解。営業利益＝5,000－3,000－1,200＝800万円。経常利益＝営業利益＋営業外収益－営業外費用＝800＋100－50＝850万円。", "800万円は営業利益であり、営業外損益を加味する前の値。", "900万円は営業外費用を差し引かずに加算した誤った計算による値。", "750万円は営業外収益と営業外費用の扱いを取り違えた誤った計算による値。"], "id": 85}, {"cat": "企業と法務", "q": "ある設備投資額300万円を行い、年間60万円のコスト削減効果が見込まれるとき、投資回収期間はどれか。", "choices": ["5年", "6年", "50年", "0.2年"], "ans": 0, "notes": ["正解。投資回収期間＝投資額÷年間の効果額＝300万円÷60万円＝5年。", "6年は計算を誤った値。", "50年は桁を誤った計算による値。", "0.2年は投資額と効果額を逆にして計算した値。"], "id": 86}, {"cat": "コンピュータシステム", "q": "稼働率0.9の装置を2台直列に接続したシステム全体の稼働率はどれか。", "choices": ["0.81", "0.99", "0.90", "1.80"], "ans": 0, "notes": ["正解。直列システムの稼働率は各装置の稼働率の積。0.9×0.9＝0.81。", "0.99は並列（どちらか一方が稼働していればよい構成）で計算した場合の値であり、直列の場合とは異なる。", "0.90は装置1台分の稼働率であり、2台の直列接続を考慮していない。", "1.80は稼働率を単純に合計した誤った計算による値（稼働率は1を超えない）。"], "id": 87}, {"cat": "コンピュータシステム", "q": "稼働率0.8の装置を2台並列（どちらか一方が稼働していればよい構成）に接続したシステム全体の稼働率はどれか。", "choices": ["0.96", "0.64", "1.60", "0.80"], "ans": 0, "notes": ["正解。並列システムの稼働率は1－（各装置の非稼働率の積）。1－(1－0.8)×(1－0.8)＝1－0.04＝0.96。", "0.64は直列（0.8×0.8）で計算した場合の値であり、並列の場合とは異なる。", "1.60は稼働率を単純に合計した誤った計算による値（稼働率は1を超えない）。", "0.80は装置1台分の稼働率であり、2台の並列接続による向上を考慮していない。"], "id": 88}, {"cat": "コンピュータシステム", "q": "あるシステムのMTBF（平均故障間動作時間）が180時間、MTTR（平均修復時間）が20時間であるとき、このシステムの稼働率はどれか。", "choices": ["0.9", "0.111", "0.818", "1.0"], "ans": 0, "notes": ["正解。稼働率＝MTBF÷（MTBF＋MTTR）＝180÷(180＋20)＝180÷200＝0.9。", "0.111はMTTR÷MTBFを計算した値であり、稼働率の計算式とは異なる。", "0.818は分母の計算を誤った値。", "1.0は修復時間を考慮していない誤った値。"], "id": 89}, {"cat": "技術要素", "q": "回線の伝送速度が100Mbps、伝送効率が80％であるとき、300MB（メガバイト）のファイルを転送するのにかかる時間は約何秒か。ただし、1MB=8Mbitとする。", "choices": ["30秒", "24秒", "20秒", "3.75秒"], "ans": 0, "notes": ["正解。ファイルサイズは300MB×8＝2,400Mbit。実効速度は100Mbps×0.8＝80Mbps。転送時間＝2,400÷80＝30秒。", "24秒は伝送効率を考慮せずに計算した値（2,400÷100）。", "20秒は伝送効率を誤った方向に適用した値。", "3.75秒はMBをMbitに変換せずに計算した誤った値。"], "id": 90}, {"cat": "技術要素", "q": "伝送速度80Mbpsの回線を使って、1,000KB（キロバイト）のデータを転送するには理論上何秒かかるか。ただし1KB=8Kbit、伝送効率は100％とする。", "choices": ["0.1秒", "1秒", "0.8秒", "10秒"], "ans": 0, "notes": ["正解。データ量は1,000KB×8＝8,000Kbit＝8Mbit。転送時間＝8Mbit÷80Mbps＝0.1秒。", "1秒は桁を誤った計算による値。", "0.8秒は単位変換を誤った値。", "10秒も桁を誤った計算による値。"], "id": 91}, {"cat": "基礎理論", "q": "1文字を2バイトで表現する文字コードを使用して、10,000文字から成る文章を保存するのに必要な記憶容量はどれか。", "choices": ["20,000バイト", "10,000バイト", "40,000バイト", "5,000バイト"], "ans": 0, "notes": ["正解。必要な記憶容量＝1文字当たりのバイト数×文字数＝2バイト×10,000文字＝20,000バイト。", "10,000バイトは1文字1バイトとして計算した誤った値。", "40,000バイトは1文字4バイトとして計算した誤った値。", "5,000バイトは文字数をバイト数で割ってしまった誤った値。"], "id": 92}, {"cat": "基礎理論", "q": "10進数の27を2進数で表したものはどれか。", "choices": ["11011", "11100", "10111", "11001"], "ans": 0, "notes": ["正解。27＝16＋8＋2＋1＝11011(2)。", "11100は28に相当する値であり、27とは異なる。", "10111は23に相当する値であり、27とは異なる。", "11001は25に相当する値であり、27とは異なる。"], "id": 93}, {"cat": "基礎理論", "q": "赤玉3個、白玉2個が入った袋から玉を1個取り出すとき、それが白玉である確率はどれか。", "choices": ["2/5", "3/5", "1/2", "1/5"], "ans": 0, "notes": ["正解。白玉2個／全体5個＝2/5。", "3/5は赤玉を取り出す確率であり、白玉の確率とは異なる。", "1/2は玉の種類数（2種類）を基準に誤って計算した値。", "1/5は白玉が1個であるかのように誤って計算した値。"], "id": 94}, {"cat": "開発技術", "q": "あるシステム開発において、1人月当たりの開発コストが80万円であり、開発規模が15人月と見積もられているとき、開発費用はどれか。", "choices": ["1,200万円", "950万円", "600万円", "1,600万円"], "ans": 0, "notes": ["正解。開発費用＝1人月当たりコスト×開発規模＝80万円×15人月＝1,200万円。", "950万円は計算を誤った値。", "600万円は人月数を半分にするなどした誤った値。", "1,600万円は単価を誤って倍にするなどした値。"], "id": 95}];
const CATEGORIES = ["企業と法務", "経営戦略", "システム戦略", "開発技術", "プロジェクトマネジメント", "サービスマネジメント", "基礎理論", "コンピュータシステム", "技術要素"];

let activeCategory = "すべて";
let shuffleOn = false;
let order = ALL_QUESTIONS.map(q => q.id);   // list of ids in current display order
let cursor = 0;                              // index within `order`
let answers = {};                            // id -> chosen index
let wrongIds = new Set();

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function rebuildOrder(preserveId){
  let pool = ALL_QUESTIONS;
  if(activeCategory !== "すべて"){
    pool = ALL_QUESTIONS.filter(q => q.cat === activeCategory);
  }
  let ids = pool.map(q => q.id);
  if(shuffleOn) ids = shuffleArray(ids);
  order = ids;
  if(order.length === 0){ cursor = 0; return; }
  if(preserveId !== undefined){
    const idx = order.indexOf(preserveId);
    cursor = idx >= 0 ? idx : 0;
  } else {
    cursor = 0;
  }
}

function qById(id){ return ALL_QUESTIONS.find(q => q.id === id); }

function renderChips(){
  const row = document.getElementById('chipsRow');
  row.innerHTML = '';
  const cats = ["すべて", ...CATEGORIES];
  cats.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat === activeCategory ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => {
      activeCategory = cat;
      rebuildOrder();
      renderChips();
      renderCard();
    };
    row.appendChild(chip);
  });
  const shuffleChip = document.createElement('div');
  shuffleChip.className = 'chip shuffle' + (shuffleOn ? ' on' : '');
  shuffleChip.textContent = shuffleOn ? '🔀 シャッフル中' : '🔀 シャッフル';
  shuffleChip.onclick = () => {
    shuffleOn = !shuffleOn;
    const currentId = order[cursor];
    rebuildOrder(shuffleOn ? undefined : currentId);
    renderChips();
    renderCard();
  };
  row.appendChild(shuffleChip);
}

function updateProgress(){
  const total = order.length;
  const label = document.getElementById('progressLabel');
  const fill = document.getElementById('progressFill');
  const score = document.getElementById('scoreLabel');
  if(total === 0){
    label.textContent = '0 / 0';
    fill.style.width = '0%';
  } else {
    label.textContent = (cursor+1) + ' / ' + total;
    fill.style.width = (((cursor+1)/total)*100) + '%';
  }
  const answeredCorrect = Object.keys(answers).filter(id => {
    const q = qById(Number(id));
    return q && answers[id] === q.ans;
  }).length;
  score.textContent = '正解 ' + answeredCorrect;
}

function updateReviewPanel(){
  const countEl = document.getElementById('reviewCount');
  const listEl = document.getElementById('reviewList');
  const emptyEl = document.getElementById('reviewEmpty');
  const ids = Array.from(wrongIds).sort((a,b)=>a-b);
  countEl.textContent = ids.length + '問';
  countEl.className = 'review-count' + (ids.length === 0 ? ' zero' : '');
  listEl.innerHTML = '';
  if(ids.length === 0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    ids.forEach(id => {
      const chip = document.createElement('div');
      chip.className = 'review-chip';
      chip.textContent = 'Q' + id;
      chip.onclick = () => {
        activeCategory = "すべて";
        shuffleOn = false;
        rebuildOrder(id);
        renderChips();
        renderCard();
        window.scrollTo({top:0, behavior:'smooth'});
      };
      listEl.appendChild(chip);
    });
  }
}

function selectChoice(q, idx){
  answers[q.id] = idx;
  if(idx !== q.ans){ wrongIds.add(q.id); } else { wrongIds.delete(q.id); }
  renderCard();
  updateReviewPanel();
}

function renderCard(){
  const card = document.getElementById('card');
  if(order.length === 0){
    card.innerHTML = '<div class="empty-state">この分野の問題は現在ございませんわ。<br>別のタグをお選びくださいませ。</div>';
    updateProgress();
    return;
  }
  const id = order[cursor];
  const q = qById(id);
  const chosen = answers[q.id];
  const answered = chosen !== undefined;

  let html = '';
  if(answered){
    const isCorrect = chosen === q.ans;
    html += '<div class="stamp show ' + (isCorrect?'correct':'wrong') + '">' + (isCorrect?'○ 正解':'✕ 不正解') + '</div>';
  }
  html += '<span class="cat-tag">' + q.cat + '</span><span class="q-number">Q' + q.id + '</span>';
  html += '<div class="q-text">' + q.q + '</div>';

  q.choices.forEach((c, idx) => {
    let cls = 'choice' + (answered ? ' locked' : '');
    if(answered){
      if(idx === q.ans) cls += ' correct';
      else if(idx === chosen) cls += ' wrong';
    }
    html += '<div class="' + cls + '" data-idx="' + idx + '" data-qid="' + q.id + '">';
    html += '<div class="badge">' + String.fromCharCode(65+idx) + '</div>';
    html += '<div class="choice-body">' + c;
    if(answered){
      html += '<div class="choice-note show">' + q.notes[idx] + '</div>';
    }
    html += '</div></div>';
  });

  html += '<div class="nav-row">';
  html += '<button class="nav-btn prev" id="prevBtn" ' + (cursor===0?'disabled':'') + '>← 前の問題</button>';
  html += '<button class="nav-btn next" id="nextBtn" ' + (cursor===order.length-1?'disabled':'') + '>次の問題 →</button>';
  html += '</div>';

  card.innerHTML = html;

  if(!answered){
    card.querySelectorAll('.choice').forEach(el => {
      el.addEventListener('click', () => {
        selectChoice(q, Number(el.dataset.idx));
      });
    });
  }
  document.getElementById('prevBtn').onclick = () => { if(cursor>0){ cursor--; renderCard(); } };
  document.getElementById('nextBtn').onclick = () => { if(cursor<order.length-1){ cursor++; renderCard(); } };

  updateProgress();
}

document.getElementById('jumpForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = Number(document.getElementById('jumpInput').value);
  if(!val) return;
  const idx = order.indexOf(val);
  if(idx >= 0){
    cursor = idx;
    renderCard();
  } else {
    const q = qById(val);
    if(q){
      activeCategory = "すべて";
      shuffleOn = false;
      rebuildOrder(val);
      renderChips();
      renderCard();
    }
  }
});

let reviewOpen = false;
document.getElementById('reviewHead').addEventListener('click', () => {
  reviewOpen = !reviewOpen;
  document.getElementById('reviewBody').className = 'review-body' + (reviewOpen ? ' open' : '');
  document.getElementById('reviewToggleLabel').textContent = reviewOpen ? '閉じる ▼' : '開く ▲';
});

renderChips();
rebuildOrder();
renderCard();
updateReviewPanel();
</script>
